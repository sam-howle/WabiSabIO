[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wabisabio"
version = "0.2.6"
description = "Human-like input automation framework for Windows"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Sam Howle", email = "samhowle@protonmail.com"}
]
dependencies = [
    "numpy>=1.20",
    "scanput",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/sam-howle/WabiSabIO"

[tool.setuptools]
py-modules = ["wabisabio"]
